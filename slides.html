<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TSH Beyond-Dashboard 説明スライド＆動画 | 東京システムハウス様 提案資料</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+JP:wght@400;500;700;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <script src="auth.js"></script>
  <style>
    :root {
      --bg: #070a0f;
      --surface: #0e1520;
      --surface-card: #141f2e;
      --border: #223247;
      --accent: #38bdf8;
      --gold: #C9A961;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --sidebar-width: 440px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Noto Sans JP', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* TOP HEADER BAR */
    header.deck-header {
      height: 54px;
      background: rgba(14, 21, 32, 0.95);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
      backdrop-filter: blur(8px);
    }
    .brand-title {
      font-size: 14.5px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge-tag {
      background: rgba(201, 169, 97, 0.15);
      color: var(--gold);
      border: 1px solid rgba(201, 169, 97, 0.4);
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }
    
    /* 4-TABS NAVIGATION */
    .nav-tabs-wrap {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #080d14;
      padding: 3px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .tab-link {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 12px;
      font-weight: 700;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .tab-link:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
    }
    .tab-link.active {
      background: var(--surface-card);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.3);
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: var(--surface-card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 11px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: var(--accent);
      color: #fff;
    }
    .btn.active {
      background: var(--accent);
      color: #041e49;
      border-color: var(--accent);
    }
    .btn.video-btn {
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #fff;
      border-color: #10b981;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.35);
    }
    .btn.video-btn:hover {
      background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
    }

    /* MAIN CONTAINER */
    .deck-container {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* SLIDE STAGE */
    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      position: relative;
      background: radial-gradient(circle at center, #0c1524 0%, #05080d 100%);
    }

    .slide-wrapper {
      width: 100%;
      max-width: 1280px;
      aspect-ratio: 16 / 9;
      position: relative;
      box-shadow: 0 16px 48px rgba(0, 0, 0, 0.8), 0 0 0 1px var(--border);
      border-radius: 10px;
      overflow: hidden;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: opacity 0.15s ease-out;
    }

    /* FLOATING NAV CONTROLS */
    .nav-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(14, 21, 32, 0.7);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(4px);
      z-index: 10;
    }
    .nav-arrow:hover {
      background: var(--surface-card);
      border-color: var(--accent);
      transform: translateY(-50%) scale(1.1);
    }
    .nav-arrow.prev { left: 24px; }
    .nav-arrow.next { right: 24px; }

    /* SPEAKER NOTES SIDEBAR */
    .notes-sidebar {
      width: var(--sidebar-width);
      background: var(--surface);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 50;
      user-select: text;
    }
    .notes-sidebar.hidden {
      display: none;
    }
    .notes-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      font-size: 13.5px;
      font-weight: 800;
      color: var(--gold);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-card);
    }
    .notes-body {
      flex: 1;
      padding: 20px 18px;
      overflow-y: auto;
      font-size: 14.5px;
      line-height: 1.7;
    }
    .notes-section-title {
      font-size: 16px;
      font-weight: 900;
      color: #fff;
      margin-bottom: 10px;
      border-left: 3px solid var(--accent);
      padding-left: 8px;
    }
    .notes-talk-box {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 8px;
      padding: 12px 14px;
      margin-bottom: 16px;
      color: #e0f2fe;
      font-size: 13.5px;
    }
    .notes-talk-box b {
      color: #38bdf8;
      display: block;
      margin-bottom: 4px;
      font-size: 12px;
    }

    /* GRID MODAL VIEW */
    .grid-modal {
      position: fixed;
      top: 54px;
      bottom: 48px;
      left: 0;
      right: 0;
      background: rgba(7, 10, 15, 0.95);
      backdrop-filter: blur(12px);
      z-index: 200;
      padding: 24px;
      overflow-y: auto;
      display: none;
    }
    .grid-modal.active { display: block; }
    .grid-container {
      max-width: 1380px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 16px;
    }
    .grid-card {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
    }
    .grid-card:hover {
      border-color: var(--accent);
      transform: translateY(-4px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
    }
    .grid-card.current {
      border-color: var(--gold);
      box-shadow: 0 0 16px rgba(201, 169, 97, 0.4);
    }
    .grid-thumb {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      display: block;
    }
    .grid-caption {
      padding: 8px 10px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: var(--surface-card);
    }

    /* VIDEO MODAL */
    .video-modal {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .video-modal.active { display: flex; }
    .video-modal-content {
      width: 100%;
      max-width: 1100px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 24px 64px rgba(0,0,0,0.9);
      position: relative;
    }
    .video-modal-header {
      padding: 14px 20px;
      background: var(--surface-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .video-player-wrap {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    .video-player-wrap video {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* FOOTER BAR */
    footer.deck-footer {
      height: 48px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 100;
      font-size: 13px;
    }
    .progress-info {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 800;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .progress-bar-wrap {
      width: 160px;
      height: 6px;
      background: #1e293b;
      border-radius: 3px;
      overflow: hidden;
    }
    .progress-bar-inner {
      height: 100%;
      background: var(--accent);
      width: 4.7%;
      transition: width 0.2s ease;
    }
    .shortcuts-help {
      color: var(--text-muted);
      font-size: 12px;
      display: flex;
      gap: 12px;
    }
    .key-badge {
      background: #1e293b;
      padding: 2px 6px;
      border-radius: 4px;
      color: #fff;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <!-- TOP HEADER WITH 4 TABS -->
  <header class="deck-header">
    <div class="brand-title">
      <span>TSH Beyond-Dashboard</span>
      <span class="badge-tag">TSH 北村部長 様 宛て</span>
    </div>

    <!-- 4 TABS NAVIGATION -->
    <nav class="nav-tabs-wrap">
      <a href="dashboard.html" class="tab-link">📊 経営ダッシュボード</a>
      <a href="slides.html" class="tab-link active">📑 説明スライド＆動画</a>
      <a href="plans.html" class="tab-link">💎 松竹梅・鶴亀プラン</a>
      <a href="simulator.html" class="tab-link">📈 TSH様 ROI試算</a>
    </nav>

    <div class="header-actions">
      <button class="btn video-btn" onclick="openVideoModal()">
        <span>🎬 解説動画を再生 (ElevenLabs v3 / 6分29秒)</span>
      </button>
      <button class="btn" id="btn-grid" onclick="toggleGrid()">
        <span>📑 一覧 (G)</span>
      </button>
      <button class="btn active" id="btn-notes" onclick="toggleNotes()">
        <span>🎙️ トーク解説 (S)</span>
      </button>
      <button class="btn" onclick="toggleFullscreen()">
        <span>⛶ 全画面 (F)</span>
      </button>
      <button class="btn" onclick="tshLogout()" title="ログアウトしてロック" style="color:#ef4444; border-color:rgba(239, 68, 68, 0.4);">
        <span>🔒 ロック</span>
      </button>
    </div>
  </header>

  <!-- MAIN DECK CONTAINER -->
  <div class="deck-container">
    <!-- STAGE AREA -->
    <div class="stage" onclick="handleStageClick(event)">
      <button class="nav-arrow prev" onclick="prevSlide(event)">❮</button>
      <button class="nav-arrow next" onclick="nextSlide(event)">❯</button>

      <div class="slide-wrapper">
        <img id="main-slide-img" class="slide-img" src="slides_img/slide-01.png" alt="Slide Image">
      </div>
    </div>

    <!-- SPEAKER NOTES SIDEBAR -->
    <aside class="notes-sidebar" id="notes-sidebar">
      <div class="notes-header">
        <span id="notes-slide-num">SLIDE 01 / 21</span>
        <span style="font-size:12px; color:var(--text-muted);">スピーカーノート（しおり社長 音声ナレーション同期）</span>
      </div>
      <div class="notes-body" id="notes-content"></div>
    </aside>
  </div>

  <!-- GRID VIEW MODAL -->
  <div class="grid-modal" id="grid-modal">
    <div class="grid-container" id="grid-container"></div>
  </div>

  <!-- VIDEO PLAYER MODAL -->
  <div class="video-modal" id="video-modal" onclick="closeVideoModal(event)">
    <div class="video-modal-content" onclick="event.stopPropagation()">
      <div class="video-modal-header">
        <div style="font-size:15px; font-weight:800; display:flex; align-items:center; gap:8px;">
          <span>🎬 TSH Beyond-Dashboard 説明動画（ナレーション: 小島しおり社長 / ElevenLabs v3 / 1.02x）</span>
        </div>
        <button class="btn" onclick="closeVideoModal()">✕ 閉じる (Esc)</button>
      </div>
      <div class="video-player-wrap">
        <video id="deck-video" controls preload="metadata" src="TSH_Beyond-Dashboard_説明動画_しおり音声_v3_1.02x.mp4"></video>
      </div>
    </div>
  </div>

  <!-- FOOTER BAR -->
  <footer class="deck-footer">
    <div class="progress-info">
      <span id="footer-page-text">01 / 21</span>
      <div class="progress-bar-wrap">
        <div class="progress-bar-inner" id="progress-bar-inner"></div>
      </div>
      <span id="footer-slide-title" style="color:var(--text); margin-left:10px; font-weight:700; font-size:13px;">表紙</span>
    </div>

    <div class="shortcuts-help">
      <span><span class="key-badge">←</span> <span class="key-badge">→</span> / <span class="key-badge">Space</span> スライド移動</span>
      <span><span class="key-badge">S</span> トークノート</span>
      <span><span class="key-badge">G</span> サムネイル</span>
      <span><span class="key-badge">V</span> 動画再生</span>
      <span><span class="key-badge">F</span> 全画面</span>
    </div>
  </footer>

    let currentIndex = 0;

    function renderSlide(index) {
      if (index < 0 || index >= SLIDES_DATA.length) return;
      currentIndex = index;
      const data = SLIDES_DATA[index];

      const img = document.getElementById('main-slide-img');
      img.style.opacity = 0;
      setTimeout(() => {
        img.src = data.file;
        img.style.opacity = 1;
      }, 100);

      document.getElementById('footer-page-text').textContent = `${String(data.id).padStart(2, '0')} / ${SLIDES_DATA.length}`;
      document.getElementById('footer-slide-title').textContent = data.title;
      const progressPercent = ((data.id) / SLIDES_DATA.length) * 100;
      document.getElementById('progress-bar-inner').style.width = `${progressPercent}%`;

      document.getElementById('notes-slide-num').textContent = `SLIDE ${String(data.id).padStart(2, '0')} / ${SLIDES_DATA.length}`;
      
      let pointsHtml = data.points.map(p => `<li>${p}</li>`).join('');
      document.getElementById('notes-content').innerHTML = `
        <div class="notes-section-title">${data.title}</div>
        <div class="notes-talk-box">
          <b>🎙️ 小島しおり社長 音声ナレーション原稿（ElevenLabs v3 / 1.02x）</b>
          ${data.talk}
        </div>
        <div style="font-size:13px; font-weight:700; color:var(--text-muted); margin-bottom:6px;">📌 スライドの要点・解説</div>
        <ul style="padding-left:18px; color:#cbd5e1; font-size:13px; line-height:1.7;">
          ${pointsHtml}
        </ul>
      `;

      document.querySelectorAll('.grid-card').forEach((card, idx) => {
        if (idx === index) card.classList.add('current');
        else card.classList.remove('current');
      });
    }

    function nextSlide(e) {
      if (e) e.stopPropagation();
      if (currentIndex < SLIDES_DATA.length - 1) renderSlide(currentIndex + 1);
    }

    function prevSlide(e) {
      if (e) e.stopPropagation();
      if (currentIndex > 0) renderSlide(currentIndex - 1);
    }

    function toggleNotes() {
      const sidebar = document.getElementById('notes-sidebar');
      const btn = document.getElementById('btn-notes');
      sidebar.classList.toggle('hidden');
      btn.classList.toggle('active');
    }

    function toggleGrid() {
      const modal = document.getElementById('grid-modal');
      const btn = document.getElementById('btn-grid');
      modal.classList.toggle('active');
      btn.classList.toggle('active');
    }

    function openVideoModal() {
      const modal = document.getElementById('video-modal');
      const video = document.getElementById('deck-video');
      modal.classList.add('active');
      video.play().catch(() => {});
    }

    function closeVideoModal(e) {
      const modal = document.getElementById('video-modal');
      const video = document.getElementById('deck-video');
      modal.classList.remove('active');
      video.pause();
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function handleStageClick(e) {
      if (e.target.closest('.nav-arrow')) return;
      const stage = document.querySelector('.stage');
      const rect = stage.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      if (clickX > rect.width * 0.65) nextSlide();
      else if (clickX < rect.width * 0.35) prevSlide();
    }

    function initGrid() {
      const container = document.getElementById('grid-container');
      container.innerHTML = '';
      SLIDES_DATA.forEach((s, idx) => {
        const card = document.createElement('div');
        card.className = `grid-card ${idx === 0 ? 'current' : ''}`;
        card.onclick = () => {
          renderSlide(idx);
          toggleGrid();
        };
        card.innerHTML = `
          <img class="grid-thumb" src="${s.file}" alt="${s.title}">
          <div class="grid-caption">${String(s.id).padStart(2, '0')}. ${s.title}</div>
        `;
        container.appendChild(card);
      });
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown' || e.key === 'l') nextSlide();
      else if (e.key === 'ArrowLeft' || e.key === 'PageUp' || e.key === 'h') prevSlide();
      else if (e.key === 's' || e.key === 'S' || e.key === 'n' || e.key === 'N') toggleNotes();
      else if (e.key === 'g' || e.key === 'G') toggleGrid();
      else if (e.key === 'v' || e.key === 'V') openVideoModal();
      else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
      else if (e.key === 'Escape') {
        const vModal = document.getElementById('video-modal');
        if (vModal.classList.contains('active')) closeVideoModal();
        const gModal = document.getElementById('grid-modal');
        if (gModal.classList.contains('active')) toggleGrid();
      }
    });

    initGrid();
    renderSlide(0);
  </script>
